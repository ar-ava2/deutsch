<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deutsch Cards</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-title" content="Deutsch">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  html, body { height: 100%; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
  .card-in { animation: cardin .25s ease-out; }
  @keyframes cardin { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .seek { -webkit-appearance: none; appearance: none; background: transparent; height: 28px; margin: 0; cursor: pointer; touch-action: none; }
  .seek:focus { outline: none; }
  .seek::-webkit-slider-runnable-track { background: transparent; height: 28px; }
  .seek::-moz-range-track { background: transparent; height: 28px; }
  .seek::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: 5px; border-radius: 9999px; background: #10b981; border: 3px solid #0f172a; box-shadow: 0 0 0 1px #10b981; }
  .seek::-moz-range-thumb { width: 12px; height: 12px; border-radius: 9999px; background: #10b981; border: 3px solid #0f172a; box-shadow: 0 0 0 1px #10b981; }
</style>
</head>
<body class="bg-slate-900 text-slate-100 select-none">
<div id="app" class="h-full max-w-md mx-auto flex flex-col"></div>

<script>
// Add new map files here (static hosting cannot list directories).
const MAP_FILES = [
  'covert_affairs_s01e01.map.js',
  'covert_affairs_s01e02.map.js',
  'covert_affairs_s01e03.map.js',
  'friends_s01e01.map.js',
  'friends_s01e02.map.js',
  'friends_s01e03.map.js',
];
const KEY = 'deutsch-progress-v1';
const REPO_CONTENTS_URL = 'https://api.github.com/repos/ar-ava2/deutsch/contents';
const app = document.getElementById('app');
const maps = {};            // name -> {en, de}
let progress = JSON.parse(localStorage.getItem(KEY) || '{}');
let onSpace = null;
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && onSpace) { e.preventDefault(); onSpace(); }
});
const save = () => localStorage.setItem(KEY, JSON.stringify(progress));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const trimDash = t => (t || '').replace(/^[\s\-–—]+/, '').trim();

function addLang(obj) {
  for (const [k, v] of Object.entries(obj || {})) {
    const pairs = v.en.map((e, j) => [trimDash(e), trimDash(v.de[j])])
      .filter(([e, d]) => e && d && !/^(yes|no)\W*$/i.test(e));
    maps[k] = { en: pairs.map(p => p[0]), de: pairs.map(p => p[1]) };
  }
}

// Script tags (not fetch) so it also works from file://. Each file does `var lang = {...}`,
// so load sequentially and merge after each one.
const loadScript = src => new Promise(res => {
  const s = document.createElement('script');
  s.src = src;
  s.onload = () => { const l = window.lang; window.lang = undefined; s.remove(); res(l); };
  s.onerror = () => { console.warn('Failed to load', src); s.remove(); res(null); };
  document.head.appendChild(s);
});

async function getMapFiles() {
  try {
    const res = await fetch(REPO_CONTENTS_URL);
    if (!res.ok) return MAP_FILES;
    const items = await res.json();
    const found = items.filter(x => x.type === 'file' && x.name.endsWith('.map.js')).map(x => x.name);
    return found.length ? [...new Set([...MAP_FILES, ...found])] : MAP_FILES;
  } catch {
    return MAP_FILES;
  }
}

async function loadMaps() {
  for (const f of await getMapFiles()) addLang(await loadScript(f));
}

function showList() {
  onSpace = null;
  const names = Object.keys(maps).sort();
  app.innerHTML = `
    <header class="px-5 pt-6 pb-3"><h1 class="text-2xl font-bold">Deutsch Cards</h1>
      <p class="text-slate-400 text-sm">Pick an episode</p></header>
    <main class="flex-1 overflow-y-auto px-4 pb-6 space-y-3">
      ${names.map(n => {
        const total = maps[n].en.length, pos = Math.min(progress[n] || 0, total);
        const pct = total ? Math.round(pos / total * 100) : 0;
        return `<button data-name="${esc(n)}" class="w-full text-left bg-slate-800 active:bg-slate-700 rounded-2xl p-4 shadow">
          <div class="flex justify-between items-baseline"><span class="font-semibold">${esc(n.replace(/_/g, ' '))}</span>
            <span class="text-sm text-slate-400">${pos} / ${total}</span></div>
          <div class="mt-3 h-2 bg-slate-700 rounded-full overflow-hidden"><div class="h-full bg-emerald-500" style="width:${pct}%"></div></div>
          <div class="text-xs text-slate-400 mt-1">${pct}%</div></button>`;
      }).join('') || '<p class="p-4 text-slate-400">No episodes available.</p>'}
    </main>`;
  app.querySelectorAll('button[data-name]').forEach(b => b.onclick = () => { location.hash = b.dataset.name; });
}

function showStudy(name) {
  const { en, de } = maps[name];
  const total = en.length;
  let i = Math.min(progress[name] || 0, total - 1);
  let revealed = false;

  app.innerHTML = `
    <header class="flex items-center gap-3 px-3 pt-4 pb-2">
      <button id="back" class="p-2 text-2xl" aria-label="Back"><i class="bi bi-arrow-left"></i></button>
      <div class="flex-1 min-w-0"><div class="truncate font-semibold">${esc(name.replace(/_/g, ' '))}</div>
        <div id="pos" class="text-xs text-slate-400"></div></div>
    </header>
    <div class="mx-4 relative h-7 flex items-center">
      <div class="absolute inset-x-0 h-1.5 bg-slate-700 rounded-full overflow-hidden"><div id="bar" class="h-full bg-emerald-500"></div></div>
      <input id="seek" type="range" min="1" max="${total}" step="1" class="seek absolute inset-x-0 w-full" aria-label="Jump to sentence">
    </div>
    <main id="stage" class="flex-1 px-4 py-5 space-y-4 overflow-hidden touch-pan-y"></main>
    <footer class="flex justify-between px-6 pb-6 text-slate-400">
      <button id="prev" class="p-3 text-2xl"><i class="bi bi-chevron-left"></i></button>
      <button id="next" class="p-3 text-2xl"><i class="bi bi-chevron-right"></i></button>
    </footer>`;
  const stage = document.getElementById('stage');
  const seek = document.getElementById('seek');
  const showPos = k => {
    document.getElementById('pos').textContent = `Sentence ${k + 1} of ${total}`;
    document.getElementById('bar').style.width = ((k + 1) / total * 100) + '%';
  };
  // While dragging only preview the position; jump to the card on release.
  seek.oninput = () => showPos(+seek.value - 1);
  seek.onchange = () => { i = +seek.value - 1; revealed = false; render(); seek.blur(); };

  function render() {
    progress[name] = i; save();
    showPos(i);
    seek.value = i + 1;
    stage.innerHTML = `
      <div id="en" class="card-in bg-sky-700 rounded-3xl p-6 text-xl leading-snug shadow-lg min-h-[7rem] flex items-center">${esc(en[i] || '—')}</div>
      ${revealed ? `<div id="de" class="card-in bg-emerald-700 rounded-3xl p-6 text-xl leading-snug shadow-lg min-h-[7rem] flex items-center">${esc(de[i] || '—')}</div>
        <p class="text-center text-xs text-slate-400">Tap or swipe the German card for next</p>`
        : `<p class="text-center text-sm text-slate-400">Tap the card to reveal German</p>`}`;
  }
  function go(d) {
    const n = i + d;
    if (n < 0 || n >= total) { if (n >= total) { progress[name] = total; save(); } return; }
    i = n; revealed = false; render();
  }
  // Progress counts completed sentences: reaching the end marks all done.
  const advance = () => { if (i === total - 1) { progress[name] = total; save(); location.hash = ''; } else go(1); };
  stage.onclick = e => {
    if (!revealed) { revealed = true; render(); }
    else if (e.target.closest('#de')) advance();
  };
  onSpace = () => { if (!revealed) { revealed = true; render(); } else advance(); };
  let y0 = null, x0 = null;
  stage.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', e => {
    if (y0 === null) return;
    const dy = e.changedTouches[0].clientY - y0, dx = e.changedTouches[0].clientX - x0;
    y0 = null;
    if (Math.abs(dy) > 40 && Math.abs(dy) > Math.abs(dx)) {
      if (!revealed && dy < 0) { revealed = true; render(); } else go(dy < 0 ? 1 : -1);
    } else if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
  });
  document.getElementById('back').onclick = () => { location.hash = ''; };
  document.getElementById('prev').onclick = () => go(-1);
  document.getElementById('next').onclick = () => go(1);
  render();
}

function route() {
  const name = decodeURIComponent(location.hash.slice(1));
  if (maps[name]) showStudy(name); else showList();
}
window.addEventListener('hashchange', route);
loadMaps().then(route);
</script>
</body>
</html>
